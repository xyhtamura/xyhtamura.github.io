This is from Taper #17: Prime, Fall 2026:

https://taperzine.org/17/stealing_the_prime.html

Before Greenwich became the international zero, maps reckoned
longitude from competing prime meridians. This poem sets five of
those origins in motion along schematic colonial routes: Greenwich
to Bombay, Paris to Saigon, San Fernando to Manila, Lisbon to Goa,
and Amsterdam to Batavia. The routes belong to different periods;
their superimposition refuses the fiction of a single imperial now.

Each ship carries its own 0° meridian. Places remain still while
east, west, and origin travel with the vessel. The five voyages last
17, 19, 23, 29, and 31 seconds. Because these durations are prime,
all five zeros depart together only once every 6,678,671 seconds:
more than seventy-seven days. The prime meridian is revealed as
cargo, while five competing primes continually steal the world’s
first position from one another.
-->
