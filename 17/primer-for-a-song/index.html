This is from Taper #17: Prime, Fall 2026:

https://taperzine.org/17/primer_for_a_song.html

Primer for a Song uses the prime numbers to reimagine what song and
voice can be. Its source is additive, made from a fundamental and the
prime-numbered partials 2, 3, 5, 7 and 11. Two filters give it formants
at prime multiples of 55 Hz. These formants help suggest the sensation
of hearing vowels. Noise shaped at prime multiples of 470 Hz gives the
voice consonants. Vowels are randomly chosen through the IPA vowel
chart, as are consonants: some that remain textual, and some that are
attempted to be articulated by the voice.

At each listening the poem draws a new scale of seventeen pitches from
the human vocal range. This makes its set of pitches entirely unlike
any human musical systems. Its melodic motion favors nearby notes and
bends into phrases, lines and breaths. Songs unfold in verses of three,
five or seven lines, each with three, five or seven syllables. While
the sound source and pitch sets do not resemble human bodies or
systems, these generated lines are all still singable by a human, with
attention to vocal range and breath.

The result is melodic glossolalia: not quite language and unfamiliar
melody, maybe a song that seems to precede both, or maybe a song
that could be in the future, or a dream.

-->

<script>
let R=Math.random,I=n=>R()*n|0,K=a=>a[I(a.length)],T=[3,5,7],D=_=>document.createElement('div'),

b=X.createBuffer(1,4e4,4e4),d=b.getChannelData(0),
v=C('Oscillator'),w=C('Gain'),n=C('BufferSource'),vg=C('Gain'),ng=C('Gain'),
[fa,fb,nf]=[0,0,0].map(_=>{let f=C('BiquadFilter');f.type='bandpass';return f}),
os=[1,2,3,5,7,11].map(h=>{let o=C('Oscillator'),g=C('Gain');g.gain.value=.8/h;o.connect(g);g.connect(fa);g.connect(fb);w.connect(o.detune);o.start();return[o,h]}),
W=(e,s,t)=>setTimeout(()=>{e.textContent+=s;Q.scrollTop=1e9},(t-X.currentTime)*1e3),
verse=_=>{
let t=X.currentTime+.2,a=R()<.5||-1,e,L=K(T);
for(l=0;l<L;l++){
e=Q.appendChild(D());
Y(vg.gain,.5,t,.06);
let N=K(T);
for(s=0;s<N;s++){
j=Math.abs(j+I(5)-2+(s*2<N?a:-a))%17;
let f=S[j],p=K([5,7,11,13]),q=K([13,17,19,23,29,37,43]),d=.2+R()*.3,y='';
if(R()<.6){let c=I(6);y="hkpʃts"[c];nf.frequency.setValueAtTime(470*[2,3,5,7,11,13][c],t);Y(ng.gain,.3,t,.01);Y(ng.gain,0,t+(c>2?.07:.03),.02);t+=.07}
os.map(z=>Z(z[0].frequency,f*z[1],t+.09));
Z(fa.frequency,55*p,t+.06);
Z(fb.frequency,55*q,t+.06);
s>N-2&&(d*=1.8);
W(e,y+G[((p>5)+(p>7)+(p>11))*3+(q<31)+(q<19)],t);
t+=d}
Y(vg.gain,0,t,.05);t+=.3+R()*.5}
Q.appendChild(D()).textContent='\xa0';
setTimeout(verse,(t+.8+R()-X.currentTime)*1e3)};
for(l=0;l<4e4;)d[l++]=R()-.5;
vg.gain.value=0;vg.connect(X.destination);
[fa,fb].map(f=>{f.Q.value=9;f.connect(vg)});
v.frequency.value=5;w.gain.value=9;v.connect(w);v.start();
ng.gain.value=0;nf.connect(ng);ng.connect(X.destination);
n.buffer=b;n.loop=1;n.connect(nf);n.start();
onclick=_=>X.resume().then(_=>U||(U=1,Q.textContent='',verse()));
