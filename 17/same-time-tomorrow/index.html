This is from Taper #17: Prime, Fall 2026:

https://taperzine.org/17/same_time_tomorrow.html

The iroha is a perfect pangram from late Heian Japan, probably composed
between the late tenth and mid-eleventh centuries. Its earliest known
surviving copy dates to 1079. It uses each of forty-seven historical
kana once, including ゐ and ゑ, and is commonly read as a Buddhist poem
about impermanence: what in this world remains unchanged?

Iroha Clock performs that question computationally. Each second it
reads the poem from a new offset; every forty-seven seconds it
returns to the first position with a new stride. The first two returns
modernize ゐ and ゑ into い and え. On every return thereafter, the
next prime selects a position by its residue modulo 47. A random kana
is grafted over that sign. Each palimpsested kana can only hold two;
after that, the older kana is removed. The sequence of prime numbers
is deterministic, but it is also aperiodic (as far as we know).
There is no going back to the original iroha.

Its incremental search for each next prime also grows more
demanding, giving it a latent computational senescence: ordinary at
human scale, but burdened in its distant future.
