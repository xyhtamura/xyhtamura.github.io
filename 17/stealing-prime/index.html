Before the conference of 1884 made Greenwich the international zero,
longitude was reckoned from competing prime meridians. Five of them
appear here, each paired with a colony of the same power: Greenwich
and Bombay, Paris and Saigon, San Fernando and Manila, Lisbon and
Goa, Amsterdam and Batavia. The pairings belong to different periods;
their superimposition refuses the fiction of a single imperial now.

Each zero leaves its European city on a random walk. The destination
pulls harder the nearer the zero comes, so the line wanders freely at
the start and is drawn in at the end. On arrival the count beside the
destination rises by one and the zero returns to Europe to set out
again. The cities hold still. Only the origin moves, and it is the
colony that takes it.

Longitude is time. Fifteen degrees is one hour, so the distance
between a wandering zero and its colony is a clock reading, and it is
printed under the colony's name. At departure these are the
historical offsets: Bombay four forty-eight from Greenwich, Saigon
six fifty-eight from Paris, Goa five thirty-one from Lisbon. They
drift because the origin drifts. At the moment of arrival the reading
is zero, the colony's time having become the metropole's. That is
what the count counts.

WHY THE DESTINATIONS ARE ALL IN ASIA

These five pairs are one specific colonial operation, and it is the
only one this poem's mechanism can state honestly: a European
observatory fixing a colonial city's longitude, and with it that
city's clock, as a subtraction from the metropole. Madras Observatory
was built in 1792 to fix Indian positions against Greenwich, and
Madras time went on to govern the Indian railways. Bombay followed in
1823, Manila in 1865. Bombay kept its own time, four fifty-one ahead
of Greenwich, until 1955. Batavia ran at seven minutes past seven.
These are clocks defined as a distance from a European zero, and a
distance is what this poem knows how to draw.

Africa was not given a clock. It was given the grid. The Berlin
Conference sat from November 1884 to February 1885, weeks after
Washington had settled the prime meridian, and partitioned the
continent along lines of latitude and longitude drawn in Europe. A
large share of Africa's modern borders are straight geometric lines,
and they are the same instrument turned on land instead of on the
day. Clock time arrived later and from outside: Cape Mean Time in
1892, South African Standard Time in 1903. The Royal Observatory at
the Cape of Good Hope, founded in 1820, was built to serve the
passage to India rather than the Cape. Africa's relation to the prime
meridian is a cut through territory, not an offset in the hour. A
moving zero with a clock beside it would state that wrongly, so it is
not attempted here. It needs a different poem, and the omission is
the argument, not an oversight.

The Americas were not receiving a zero. They were running their own,
and eventually they set the terms for everyone. The fixed line on
this map is the Treaty of Tordesillas of 1494, which divided the
world between Spain and Portugal along a meridian three hundred and
seventy leagues west of Cape Verde, near forty-six degrees thirty-
seven minutes west. It is why Brazil speaks Portuguese. Zaragoza drew
the far side of the same division in 1529 and placed the Philippines
nominally in Portugal's half; Spain took it regardless. Neither crown
could locate its own line, because longitude at sea could not yet be
measured, and the position stayed in dispute for centuries. Spain
offered a longitude prize under Philip II in 1567 and again under
Philip III in 1598, more than a century before the British Board of
Longitude of 1714. The longitude problem was born here. Europe needed
longitude in order to know who owned what.

That line does not move. It is the only thing on this map that does
not. The same hemisphere set the terms again later: the United States
fixed its own prime meridian at Washington in 1850, American railways
imposed standard time on the eighteenth of November 1883, and the
conference that gave Greenwich the world met in Washington the
following year, France and Brazil abstaining. And the Manila galleon
had already carried Acapulco's calendar across the Pacific, which is
why the Philippines deleted the thirtieth of December 1844 by decree
and crossed to Asian dating. It is also why the Spanish zero here
sails west, leaves the map at one edge, and returns at the other.

THE PRIMES

The five zeros step at intervals of 17, 19, 23, 29, and 31 tenths of
a second. Because those numbers are prime, all five step together
only once every 6,678,671 steps, a little under eight days. Between
steps the walk is interpolated, so the motion is continuous while the
decisions are not. Each walk is drawn fresh. No two readings arrive
at the same counts.
