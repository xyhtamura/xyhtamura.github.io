<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=../../hindcasts/pythia/index.html">
    <title>Pythia moved</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #10100d;
            --panel: #171812;
            --text: #f0ebd8;
            --muted: #a8a18d;
            --acid: #c2dc32;
            --line: #333522;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 40%, rgba(194, 220, 50, 0.18), transparent 28rem),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 9px),
                var(--bg);
            color: var(--text);
            font-family: "DM Mono", Consolas, "Liberation Mono", monospace;
        }

        main {
            width: min(88vw, 680px);
            padding: 44px 32px;
            border: 1px solid var(--line);
            background: color-mix(in srgb, var(--panel) 88%, transparent);
            box-shadow: 0 22px 80px rgba(0, 0, 0, 0.42);
        }

        .eyebrow {
            margin: 0 0 14px;
            color: var(--acid);
            font-size: 0.74rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 11vw, 7rem);
            line-height: 0.9;
            letter-spacing: 0;
            font-weight: 400;
        }

        p {
            max-width: 46rem;
            margin: 24px 0 0;
            color: var(--muted);
            font-size: clamp(0.95rem, 2vw, 1.08rem);
            line-height: 1.65;
        }

        a {
            display: inline-flex;
            align-items: center;
            margin-top: 28px;
            padding: 10px 14px;
            border: 1px solid var(--acid);
            color: var(--text);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.78rem;
        }

        a:hover,
        a:focus-visible {
            background: var(--acid);
            color: var(--bg);
            outline: none;
        }

        @media (max-width: 560px) {
            main {
                width: 100vw;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                border-width: 0;
                padding: 32px 22px;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Pythia has moved</p>
        <h1>Pythia</h1>
        <p>The active anticipatory delay build now lives in Hindcasts. Redirecting to the new page.</p>
        <a href="../../hindcasts/pythia/index.html">Open Hindcasts Pythia</a>
    </main>
    <script>
        window.setTimeout(() => {
            window.location.replace("../../hindcasts/pythia/index.html");
        }, 1200);
    </script>
</body>
</html>
