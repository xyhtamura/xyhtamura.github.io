<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Xyh Tamura · Portfolio video</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div class="collage" aria-hidden="true">
    <img class="collage-landscape" src="../img/fashionhour2.jpg" alt="">
    <img class="collage-cover" src="../img/works/aftergreen.jpg" alt="">
    <img class="collage-botanical" src="../pfi/media/p14-b.png" alt="">
    <img class="collage-notation" src="../pfi/media/p06-a.jpg" alt="">
    <img class="collage-paper" src="../pfi/media/p13-d.png" alt="">
    <img class="collage-performance" src="../img/works/manifest.jpg" alt="">
    <img class="collage-game" src="../img/works/cornice.jpg" alt="">
    <img class="collage-rays" src="../img/gliese.png" alt="">
  </div>

  <main>
    <h1>Portfolio video</h1>

    <div class="player">
      <video id="intro-video" aria-label="Portfolio video" controls playsinline preload="metadata" hidden></video>
      <div class="player-status" id="player-status" role="status">Loading video…</div>
      <a class="shot-link" id="shot-link" target="_blank" rel="noopener noreferrer" aria-describedby="link-note" hidden>
        <span id="shot-title"></span>
      </a>
    </div>

    <section class="works" aria-labelledby="works-title">
      <h2 id="works-title">Works in this video</h2>
      <ul class="work-list" id="work-list"></ul>
      <p class="link-note" id="link-note">Select a work in the video or in this list to open it in a new tab.</p>
    </section>
  </main>

  <script type="module" src="player.mjs"></script>
</body>
</html>
