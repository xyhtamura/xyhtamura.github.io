<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Satin Organ Node Main Gradient -->
    <radialGradient id="organGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#f5d688" />
      <stop offset="55%" stop-color="#4dbfae" />
      <stop offset="85%" stop-color="#7353aa" />
      <stop offset="100%" stop-color="#241e33" />
    </radialGradient>
    
    <!-- Wet Glass Specular Highlight -->
    <radialGradient id="glassHighlight" cx="32%" cy="25%" r="35%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="60%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>

    <!-- Outer Bio Ambient Glow Filter -->
    <filter id="ambientShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0a0c10" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#4dbfae" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Dark Satin Background disc for tab clarity -->
  <rect width="32" height="32" rx="8" fill="#14171c" />

  <!-- Organic Asymmetrical Node Body -->
  <path d="M 16.5 4.5 C 24 4.5, 27.5 10, 27.5 17.5 C 27.5 24.5, 22 27.5, 14.5 27.5 C 7 27.5, 4.5 21.5, 4.5 14.5 C 4.5 7.5, 9 4.5, 16.5 4.5 Z" 
        fill="url(#organGlow)" 
        filter="url(#ambientShadow)" />

  <!-- Wet Glass Highlight Curve -->
  <ellipse cx="12" cy="11" rx="6" ry="4.5" transform="rotate(-18 12 11)" fill="url(#glassHighlight)" />

  <!-- Inner Bioluminescent Core Node Dot -->
  <circle cx="16.5" cy="16.5" r="2.5" fill="#f5e8a3" opacity="0.9" />
</svg>
